name: Release

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release
  queue: max

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-keychain
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record Swift version
        run: echo "SWIFT_VERSION=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Set keychain path
        run: echo "KEYCHAIN=$RUNNER_TEMP/voz.keychain-db" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          build=$(git rev-list --count HEAD)
          if [[ "$CHANNEL" == stable ]]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $tag is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          else
            base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            base=${base#v}
            base=${base:-$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)}
            version=$base-beta.$build
            tag=beta-$build
          fi
          { echo "VERSION=$version"; echo "BUILD=$build"; echo "TAG=$tag"; } >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: '1.4.0'

      - name: Test
        env:
          BUN_PATH: ${{ steps.bun.outputs.bun-path }}
        run: scripts/test.sh release

      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.VOZ_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.VOZ_SIGNING_P12_PASSWORD }}
        run: scripts/import-signing-identity.sh

      - name: Build and sign
        run: scripts/make-app.sh "$VERSION" "$BUILD"

      - name: Notarize (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_PASSWORD" || -z "$APPLE_TEAM_ID" || -z "$P12_BASE64" ]]; then
            echo "Notarization secrets not set. Skipping."
            exit 0
          fi
          scripts/import-signing-identity.sh
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in DEVELOPER_ID_P12" >&2; exit 1; }
          SIGNING_IDENTITY=$identity TIMESTAMP=http://timestamp.apple.com/ts01 scripts/make-app.sh "$VERSION" "$BUILD"
          ditto -c -k --keepParent build/voz.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/voz.app

      - name: Package and sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "SPARKLE_PRIVATE_KEY is not set" >&2; exit 1; }
          git fetch origin main
          git worktree add -B appcast "$RUNNER_TEMP/appcast" origin/main
          scripts/package-release.sh "$VERSION" "$BUILD" "$CHANNEL" "$TAG" "$RUNNER_TEMP/appcast/appcast.xml"

      - name: Create GitHub release
        run: |
          archive=build/voz-$VERSION.zip
          if [[ "$CHANNEL" == stable ]]; then
            gh release create "$TAG" "$archive" --title "voz $VERSION" --generate-notes --verify-tag
          else
            gh release create "$TAG" "$archive" --title "voz $VERSION" --notes "Automated beta build of $GITHUB_SHA." \
              --target "$GITHUB_SHA" --prerelease
          fi

      - name: Publish appcast
        working-directory: ${{ runner.temp }}/appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Prune old beta releases
        if: inputs.channel == 'beta'
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("beta-")))] | .[10:] | .[].tagName' |
            xargs -I{} gh release delete {} --cleanup-tag --yes

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
